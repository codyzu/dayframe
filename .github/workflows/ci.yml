name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    concurrency:
      group: checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      # Ordinary browser checks run first; only the verified final enabled build
      # becomes the production artifact on a main-branch push.
      DAYFRAME_RELEASE_ASSETS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install test browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check types, lint, tests, and production build
        run: pnpm verify
      - name: Preserve verified production assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://dayframe-fixture-production.cody-zuschlag.workers.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require verified Workers Free plan
        env:
          FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
        run: |
          if [ "$FREE_PLAN_CONFIRMED" != "true" ]; then
            echo 'Verify Workers Free in the target account and set the production environment variable CLOUDFLARE_FREE_PLAN_CONFIRMED=true.'
            exit 1
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore verified production assets
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: dist/
      - name: Upload verified build to Cloudflare
        run: |
          node scripts/prepare-production.mjs
          pnpm exec wrangler deploy --config private/wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYFRAME_PHOTOS_NAMESPACE_ID: ${{ secrets.DAYFRAME_PHOTOS_NAMESPACE_ID }}
      - name: Verify live deployment
        run: pnpm smoke:production
