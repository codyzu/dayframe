name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  quality:
    concurrency:
      group: quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, lint and unit tests
        run: pnpm check && pnpm lint && pnpm test
  build:
    concurrency:
      group: build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ordinary assets
        run: pnpm build
      - name: Preserve ordinary browser assets
        uses: actions/upload-artifact@v4
        with:
          name: regular-assets
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Build navigation-enabled assets
        run: DAYFRAME_OFFLINE_NAVIGATION=1 pnpm build
      - name: Preserve navigation and deployment candidate
        uses: actions/upload-artifact@v4
        with:
          name: navigation-assets
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  playwright:
    needs: build
    strategy:
      # Preserve both reports even if one suite fails.
      fail-fast: false
      matrix:
        suite: [regular, navigation]
    concurrency:
      group: playwright-${{ matrix.suite }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Keep this version equal to @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require matching browser image
        run: test "$(node -p "require('./package.json').devDependencies['@playwright/test']")" = '1.64.1'
      - name: Restore built assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.suite }}-assets
          path: dist/
      - name: Verify ordinary browser behavior
        if: matrix.suite == 'regular'
        run: pnpm test:e2e
      - name: Verify navigation-enabled browser behavior
        if: matrix.suite == 'navigation'
        # Consume the build artifact directly; do not rebuild it in this job.
        run: pnpm exec playwright test --config playwright.offline.config.ts
      - name: Preserve browser timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-timings-${{ matrix.suite }}
          path: test-results/*/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
  checks:
    # Preserve the required status name and fail closed on skipped/cancelled jobs.
    needs: [quality, build, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete verification
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$PLAYWRIGHT_RESULT" = success
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://dayframe-fixture-production.cody-zuschlag.workers.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require verified Workers Free plan
        env:
          FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
        run: |
          if [ "$FREE_PLAN_CONFIRMED" != "true" ]; then
            echo 'Verify Workers Free in the target account and set the production environment variable CLOUDFLARE_FREE_PLAN_CONFIRMED=true.'
            exit 1
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore verified production assets
        uses: actions/download-artifact@v4
        with:
          name: navigation-assets
          path: dist/
      - name: Upload verified build to Cloudflare
        run: |
          node scripts/prepare-production.mjs
          pnpm exec wrangler deploy --config private/wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYFRAME_PHOTOS_NAMESPACE_ID: ${{ secrets.DAYFRAME_PHOTOS_NAMESPACE_ID }}
      - name: Verify live deployment
        run: pnpm smoke:production
